<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GenAI interview MCQs: 200 questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF0EC; --sheet:#FAFCFA; --ink:#1B2631; --ink-soft:#4B5A67;
  --print:#2A7480; --print-soft:#A9CBCC; --print-tint:#DCEBE9;
  --ok:#1F6E43; --ok-tint:#DCEEE2; --bad:#B23A2F; --bad-tint:#F6E0DC;
  --fill:#22313F; --on-fill:#FAFCFA; --on-strong:#FFFFFF;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1719; --sheet:#162124; --ink:#E2EBE7; --ink-soft:#9AADA8;
    --print:#6DB6BF; --print-soft:#2F5458; --print-tint:#1C3134;
    --ok:#62C690; --ok-tint:#16301F; --bad:#F2806F; --bad-tint:#3A1C18;
    --fill:#E2EBE7; --on-fill:#0F1719; --on-strong:#0F1719;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1719; --sheet:#162124; --ink:#E2EBE7; --ink-soft:#9AADA8;
  --print:#6DB6BF; --print-soft:#2F5458; --print-tint:#1C3134;
  --ok:#62C690; --ok-tint:#16301F; --bad:#F2806F; --bad-tint:#3A1C18;
  --fill:#E2EBE7; --on-fill:#0F1719; --on-strong:#0F1719;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--print);outline-offset:2px;border-radius:6px}
p{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;height:58px;padding:0 20px;background:var(--paper);border-bottom:1.5px solid var(--print)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-stretch:118%;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--print);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--fill)}
.top-stats{margin-left:auto;font-size:.92rem;color:var(--ink-soft);text-align:right}
.top-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.menu-btn{display:none;align-items:center;border:1.5px solid var(--print);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.9rem;flex:none}

/* layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1200px;margin:0 auto}
.side{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 58px - env(safe-area-inset-top,0px));max-height:calc(100dvh - 58px - env(safe-area-inset-top,0px));overflow-y:auto;padding:20px 14px 40px;border-right:1px solid var(--print-soft)}
.scrim{display:none}
main{padding:28px clamp(16px,4vw,48px) 72px;min-width:0;outline:none}

/* sidebar */
.nav-top{display:grid;gap:4px;margin-bottom:20px}
.nav-link{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border-radius:9px;font-weight:700}
.nav-link:hover{background:var(--print-tint)}
.nav-link[aria-current="true"]{background:var(--fill);color:var(--on-fill)}
.nav-link .count{color:inherit;opacity:.75}
.sections{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sec{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:9px}
.sec:hover{background:var(--print-tint)}
.sec[aria-current="true"]{background:var(--print-tint);box-shadow:inset 0 0 0 1.5px var(--print)}
.sec-letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--print);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.78rem;color:var(--print);flex:none}
.sec-letter.full{background:var(--print);color:var(--sheet)}
.sec-name{font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.25}
.count{font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.subs{list-style:none;margin:2px 0 0 21px;padding:0 0 0 14px;border-left:1.5px dotted var(--print-soft)}
.sub{display:flex;justify-content:space-between;gap:8px;width:100%;padding:5px 8px;border-radius:7px;font-size:.9rem;color:var(--ink-soft)}
.sub:hover{background:var(--print-tint);color:var(--ink)}
.sub[aria-current="true"]{background:var(--print-tint);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--print)}

/* quiz header */
.quiz,.board{max-width:800px}
.set-head{display:flex;align-items:center;gap:14px}
.set-head .sec-letter{width:44px;height:44px;font-size:1.05rem;border-width:2px}
.set-title{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(1.45rem,3vw,1.95rem);line-height:1.1;margin:0;letter-spacing:-.015em}
.set-sub{color:var(--ink-soft);margin-top:3px}
.modes{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--print);border-radius:22px;padding:3px;margin:20px 0 14px;gap:2px}
.mode{padding:6px 14px;border-radius:999px;font-size:.9rem;font-weight:700;color:var(--ink-soft)}
.mode:hover{color:var(--ink)}
.mode[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.jump{margin:0 0 18px}
.jump summary{cursor:pointer;font-weight:700;color:var(--print);margin-bottom:10px;width:max-content}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--print-soft);font-size:.62rem;font-weight:700;display:grid;place-items:center;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dot:hover{border-color:var(--print);color:var(--ink)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--on-strong)}
.dot.bad{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}

/* question sheet */
.sheet{position:relative;background:var(--sheet);border:1.5px solid var(--print-soft);border-radius:14px;padding:24px 26px 26px 50px}
.sheet::before{content:"";position:absolute;left:16px;top:24px;bottom:24px;width:10px;background:repeating-linear-gradient(to bottom,var(--ink) 0 5px,transparent 5px 21px);opacity:.7}
.qhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.qnum{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:2.6rem;line-height:1;color:var(--print);font-variant-numeric:tabular-nums}
.qof{color:var(--ink-soft);font-size:.95rem}
.qtag{margin-left:auto;font-size:.8rem;color:var(--ink-soft);border:1px solid var(--print-soft);border-radius:999px;padding:2px 10px}
.qtext{font-family:var(--display);font-weight:650;font-size:clamp(1.18rem,2.4vw,1.4rem);line-height:1.38;margin:0 0 20px;max-width:62ch}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:14px;width:100%;padding:11px 14px 11px 10px;border-radius:12px;border:1.5px solid transparent;transition:background-color .15s,border-color .15s,opacity .2s}
.opt:not([aria-disabled="true"]):hover{border-color:var(--print-soft);background:var(--print-tint)}
.opt[aria-disabled="true"]{cursor:default}
.bubble{position:relative;width:36px;height:36px;border-radius:50%;border:2px solid var(--print);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;color:var(--print);isolation:isolate}
.bubble::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--fill);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.5,.6,1);z-index:-1}
.opt:not([aria-disabled="true"]):hover .bubble::after{transform:scale(.35);opacity:.25}
.is-correct{background:var(--ok-tint);border-color:var(--ok)}
.is-correct .bubble{border-color:var(--ok);color:var(--on-strong)}
.is-correct .bubble::after{background:var(--ok);transform:scale(1)}
.is-wrong{background:var(--bad-tint);border-color:var(--bad)}
.is-wrong .bubble{border-color:var(--bad);color:var(--on-strong)}
.is-wrong .bubble::after{background:var(--bad);transform:scale(1)}
.is-dim{opacity:.5}
.otext{line-height:1.45}
.olabel{display:block;font-size:.8rem;font-weight:700;margin-top:2px}
.is-correct .olabel{color:var(--ok)}
.is-wrong .olabel{color:var(--bad)}
.explain{margin-top:20px;padding:16px 18px;border-radius:12px;border-left:4px solid var(--ok);background:var(--ok-tint);animation:reveal .3s ease-out}
.explain.bad{border-left-color:var(--bad);background:var(--bad-tint)}
.verdict{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-bottom:6px}
.explain.ok .verdict{color:var(--ok)}
.explain.bad .verdict{color:var(--bad)}
.ex{line-height:1.62;max-width:68ch}
.ex-label{font-weight:700}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.controls{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.controls .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;border-radius:999px;border:1.5px solid var(--print);font-weight:700;font-size:.95rem;min-height:42px}
.btn:hover{background:var(--print-tint)}
.btn.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.btn.primary:hover{opacity:.9;background:var(--fill)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.quiet{border-color:transparent;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--on-strong)}
.hint{font-size:.84rem;color:var(--ink-soft);margin-top:14px}
kbd{font-family:var(--body);font-size:.78rem;border:1px solid var(--print-soft);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--sheet)}
.empty{background:var(--sheet);border:1.5px dashed var(--print-soft);border-radius:14px;padding:28px}
.empty h2{font-family:var(--display);font-weight:800;margin:0 0 6px;font-size:1.25rem}
.empty p{color:var(--ink-soft);margin-bottom:16px;max-width:56ch}

/* marksheet */
.board h1{font-family:var(--display);font-stretch:120%;font-weight:900;font-size:clamp(2.1rem,5vw,3.1rem);margin:0;letter-spacing:-.02em;line-height:1}
.lede{color:var(--ink-soft);max-width:62ch;margin-top:10px}
.total{display:grid;grid-template-columns:auto 1fr;gap:10px 30px;align-items:center;padding:22px 26px;border:1.5px solid var(--print);border-radius:14px;background:var(--sheet);margin:24px 0}
.total-marks{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(3rem,9vw,4.4rem);line-height:.9;color:var(--print);font-variant-numeric:tabular-nums}
.total-marks small{font-size:.36em;color:var(--ink-soft);font-weight:700;font-stretch:100%}
.total-cap{display:block;font-family:var(--body);font-size:.85rem;color:var(--ink-soft);font-weight:400;margin-top:8px;letter-spacing:0}
.total-facts{display:grid;gap:4px}
.total-facts b{font-variant-numeric:tabular-nums}
.total-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.weak{margin:0 0 24px;padding:18px 20px;border-radius:14px;background:var(--bad-tint);border-left:4px solid var(--bad)}
.weak h2{font-family:var(--display);font-weight:800;font-size:1.1rem;margin:0 0 8px}
.weak ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.weak button{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.weak span{color:var(--ink-soft)}
.marks-wrap{overflow-x:auto;border:1.5px solid var(--print-soft);border-radius:14px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:.82rem;padding:12px 12px;border-bottom:1.5px solid var(--print);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--print-tint);vertical-align:middle}
tr.topic td{border-top:1.5px solid var(--print-soft)}
tr.topic:first-child td{border-top:0}
tr.topic .tname{font-family:var(--display);font-weight:800;font-size:1rem}
tr.subrow .tname{padding-left:16px;color:var(--ink-soft)}
.tname{text-decoration:none}
.tname:hover{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{text-align:right}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--print-tint);min-width:110px}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}
.bar .b-bad{background:var(--bad)}
.mini{font-size:.82rem;font-weight:700;color:var(--print);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.mini.danger{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.84rem;color:var(--ink-soft);margin:12px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;color:var(--ink-soft);font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width: 880px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:70;width:min(86vw,330px);max-height:none;background:var(--paper);border-right:1.5px solid var(--print);transform:translateX(-102%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;z-index:65;background:rgba(10,20,22,.45)}
  .hide-sm{display:none}
}
@media (max-width: 560px){
  body{font-size:16px}
  .top{padding:0 14px;gap:10px}
  .brand{font-size:.95rem}
  .top-stats{font-size:.82rem}
  .sheet{padding:20px 16px 20px 36px}
  .sheet::before{left:11px;width:8px}
  .qnum{font-size:2.1rem}
  .qtag{margin-left:0}
  .opt{gap:10px;padding:10px 10px 10px 6px}
  .total{grid-template-columns:1fr;padding:20px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" data-act="menu" aria-expanded="false" aria-controls="side">Topics</button>
  <button class="brand" data-act="board"><span class="brand-mark" aria-hidden="true"></span>GenAI MCQ sheet</button>
  <p class="top-stats" id="topStats" aria-live="polite"></p>
</header>
<div class="layout">
  <aside class="side" id="side"><nav id="nav" aria-label="Topics and subtopics"></nav></aside>
  <div class="scrim" data-act="menu-close"></div>
  <main id="main" tabindex="-1"></main>
</div>
<script>
// Each row: [subtopicIndex, question, correctAnswer, [wrong1, wrong2, wrong3], explanation]
// Options are shuffled at display time, so the correct answer is always written first here.
const TOPICS = [
{
  id:"ml", name:"AI & ML fundamentals",
  subs:["Core concepts","Learning types","Model training","Evaluation metrics"],
  qs:[
  [0,"How are AI, Machine Learning and Deep Learning related?","Deep Learning is a subset of ML, and ML is a subset of AI",["AI is a subset of ML, and ML is a subset of Deep Learning","They are three completely independent fields","ML is a subset of Deep Learning, which is a subset of AI"],"Socho matryoshka dolls jaisa: AI sabse bada doll hai (machines ko smart banana), uske andar ML (data se seekhna), aur uske andar Deep Learning (multi-layer neural networks se seekhna). Har DL system ML hai, har ML system AI hai — ulta nahi."],
  [0,"What best describes Generative AI?","AI that creates new content like text, images, code or audio by learning patterns from data",["AI that only sorts inputs into fixed, predefined categories","A rule-based system built from hand-written if-else logic","A search engine that returns stored answers word for word"],"GenAI ka kaam hai naya content banana — jaise ek cook jo hazaar recipes padhke apni nayi dish bana de. Classification models sirf label lagate hain; GenAI training data ke patterns se bilkul naya output generate karta hai."],
  [0,"What is the key difference between a discriminative and a generative model?","Discriminative models learn P(y|x) to separate classes; generative models learn how the data itself is distributed, P(x) or P(x, y)",["Discriminative models need no training data; generative models do","Generative models work only with images, discriminative only with text","There is no difference — the two terms mean the same thing"],"Discriminative model sirf boundary seekhta hai — “ye cat hai ya dog?” Generative model poore data ka pattern seekhta hai, isliye wo naye samples bana sakta hai. Example: logistic regression discriminative hai, GPT generative."],
  [0,"Which of these is a typical example of narrow AI?","A model that only recommends movies on a streaming app",["A system that matches human intelligence across every task","A robot with genuine human-like consciousness","An AI that can independently do any job a person can"],"Narrow (weak) AI ek specific kaam mein accha hota hai — recommendation, spam filter, chess. Jo AI har task mein insaan jitna capable ho use AGI (Artificial General Intelligence) kehte hain, jo abhi research ka goal hai."],
  [1,"Supervised learning trains a model using…","Labelled data, where each input comes with the correct output",["Only unlabelled data with no answers attached","Rewards and penalties from an environment","No data at all — only hand-written rules"],"Supervised = teacher ke saath padhai. Har example ke saath sahi answer (label) diya hota hai, jaise emails ke saath “spam / not spam” tag. Model input se output ka mapping seekhta hai."],
  [1,"Grouping customers into segments by their buying behaviour, with no labels given, is an example of…","Unsupervised learning (clustering)",["Supervised classification","Reinforcement learning","Regression"],"Jab labels nahi hote aur model khud patterns ya groups dhoondhta hai, wo unsupervised learning hai. K-Means clustering iska classic example hai — jaise kirana wala bina kisi ke bataye samajh jaaye ki kaun daily-milk customer hai aur kaun monthly-bulk wala."],
  [1,"An agent learning to play a game through trial and error, guided by rewards, uses…","Reinforcement learning",["Supervised learning","Unsupervised clustering","Dimensionality reduction"],"Reinforcement Learning (RL) mein agent action leta hai, environment se reward ya penalty milti hai, aur wo dheere dheere best strategy (policy) seekhta hai — jaise bachcha cycle chalana seekhta hai, girke aur sambhalke."],
  [1,"LLM pretraining on raw internet text is usually described as…","Self-supervised learning, because the labels (next words) come from the text itself",["Fully supervised learning with human-labelled answers for every sentence","Reinforcement learning from the very first step","Unsupervised clustering of documents"],"Text khud hi label deta hai: “Main chai ___” — agla word “peeta hoon” already data mein hai. Isliye kisi insaan ko label lagane ki zarurat nahi. Isse self-supervised learning kehte hain."],
  [1,"Predicting the price of a flat in Pune from its size and location is a…","Regression problem",["Classification problem","Clustering problem","Reinforcement learning problem"],"Output ek continuous number hai (₹ price), isliye regression. Agar output category hota (jaise “cheap / premium”), tab classification hota."],
  [2,"A model scores 99% on training data but only 60% on new data. This is called…","Overfitting",["Underfitting","Perfect generalisation","Data augmentation"],"Model ne training data ratta maar liya, concept nahi samjha — jaise student jo sirf pichle saal ke paper yaad kare aur naye questions pe fail ho jaaye. Ise overfitting kehte hain."],
  [2,"Which technique helps reduce overfitting?","Adding regularisation such as an L2 penalty or dropout",["Training for many more epochs on the same data","Making the model much bigger with no other change","Removing the validation set"],"Regularisation model ko zyada complex hone se rokta hai, taaki wo noise ratta na maare. More data, dropout aur early stopping bhi help karte hain. Zyada epochs ya bada model overfitting aur badha sakta hai."],
  [2,"A model that is too simple and performs poorly on both training and test data suffers from…","High bias (underfitting)",["High variance (overfitting)","Data leakage","Low bias and low variance"],"High bias = model ki assumptions bahut simple hain, pattern pakad hi nahi pa raha — jaise curved data pe seedhi line fit karna. Training pe bhi kharab, test pe bhi kharab."],
  [2,"Why do we keep a separate validation set?","To tune hyperparameters and catch overfitting without touching the test set",["To add more training examples to the model","To make training run faster","To store the final model weights"],"Training set se seekhte hain, validation set se settings tune karte hain, aur test set final exam hai jo end mein ek baar dekhte hain. Test set ko tuning mein use kiya toh result over-optimistic ho jaata hai."],
  [2,"What does gradient descent do?","Repeatedly updates parameters in the direction that reduces the loss",["Randomly guesses new weights until accuracy improves","Increases the loss to explore more solutions","Sorts the training data by difficulty"],"Socho aankh band karke pahaad se neeche utarna hai — har step pe dekhte ho ki dhalaan kis taraf neeche ja rahi hai aur wahi chalte ho. Gradient batata hai loss kis direction mein badhta hai; hum ulti direction mein step lete hain."],
  [2,"What usually happens if the learning rate is set too high?","The loss jumps around or even blows up instead of steadily decreasing",["Training becomes extremely slow but very stable","The model automatically becomes smaller","Nothing — learning rate has no real effect"],"Learning rate = step ka size. Bahut bada step lo toh valley ke bottom ko overshoot kar jaate ho aur idhar-udhar uchhalte rehte ho. Bahut chhota lo toh training bahut slow."],
  [2,"Which of these is a hyperparameter rather than a learned parameter?","Learning rate",["The weights of a neural network","The biases inside each layer","The values inside an embedding matrix"],"Parameters (weights, biases) model training ke dauraan khud seekhta hai. Hyperparameters (learning rate, batch size, epochs) hum training se pehle set karte hain — jaise oven ka temperature, jo cook decide karta hai, cake nahi."],
  [3,"Precision is calculated as…","TP / (TP + FP)",["TP / (TP + FN)","(TP + TN) / total","FP / (FP + TN)"],"Precision = jitne cases ko model ne “positive” bola, unme se kitne sach mein positive the. TP = true positive, FP = false positive (galti se positive bola). TP / (TP + FN) recall hota hai."],
  [3,"For cancer screening, which metric matters most if missing a real patient is very costly?","Recall",["Precision","Accuracy","Training loss"],"Recall = asli positive cases mein se kitne pakde. Cancer mein ek bhi patient miss karna (false negative) bahut mehenga hai, isliye recall high chahiye — chahe kuch false alarms aa jaayein."],
  [3,"The F1 score is…","The harmonic mean of precision and recall",["The average of accuracy and loss","Precision multiplied by recall","The number of correct predictions"],"F1 = 2 × P × R / (P + R). Harmonic mean dono mein se chhoti value ki taraf jhukta hai, isliye F1 tabhi high hoga jab precision aur recall dono acche hon."],
  [3,"Why can accuracy be misleading on an imbalanced dataset?","A model can predict only the majority class and still get very high accuracy",["Accuracy cannot be calculated when classes are imbalanced","Accuracy always shows lower values than precision","Imbalanced data makes accuracy exactly 50%"],"Agar 99% transactions normal hain aur 1% fraud, toh “sab normal hai” bolne wala bekaar model bhi 99% accurate dikhega. Aise cases mein precision, recall, F1 ya AUC dekhte hain."]
  ]

{
  id:"dl", name:"Deep learning & generative models",
  subs:["Neural network basics","Activation & loss","Training deep nets","Architectures","Generative models"],
  qs:[
  [0,"What does a single artificial neuron compute?","A weighted sum of its inputs plus a bias, passed through an activation function",["The average of all training labels","A random number between 0 and 1","An exact copy of its largest input"],"Neuron = har input ko uske weight se multiply karo, sab jodo, bias add karo, phir activation function se pass karo. Weights batate hain kaunsa input kitna important hai."],
  [0,"Why do neural networks need non-linear activation functions?","Without them, stacked layers collapse into one linear function and can’t learn complex patterns",["To make the network run faster on CPUs","To reduce the number of parameters to zero","Because linear functions cannot be differentiated"],"Linear ke upar linear = phir bhi linear. 100 layers bina activation ke ek single layer jitni hi powerful hongi. Non-linearity (ReLU, GELU) se network curves aur complex patterns seekh pata hai."],
  [0,"What is backpropagation?","Using the chain rule to work out how much each weight contributed to the loss, moving backwards layer by layer",["Running the model on test data after training","Copying weights from the last layer to the first","Removing layers that are not useful"],"Pehle forward pass se prediction aur loss nikalta hai. Phir backprop peeche ki taraf chain rule lagake har weight ka gradient (blame) nikalta hai, taaki gradient descent use update kar sake."],
  [0,"One epoch means…","One complete pass of the model over the entire training dataset",["One single weight update","Processing exactly one training example","The time taken to load the data"],"Socho poori textbook ek baar padh li = 1 epoch. Usually model ko kai epochs chahiye hote hain, aur har epoch mein kai batches aur kai weight updates hote hain."],
  [0,"Batch size refers to…","The number of training examples processed before one weight update",["The total number of layers in the network","The number of epochs in training","The size of the final saved model file"],"Saara data ek saath GPU mein nahi aata, toh chhote batches mein bhejte hain. Batch size 32 = 32 examples dekho, average gradient nikalo, phir ek update karo."],
  [1,"The ReLU activation function outputs…","max(0, x)",["1 / (1 + e^−x)","x squared","Always exactly 1"],"ReLU (Rectified Linear Unit): negative input → 0, positive input → as it is. Simple aur fast hai, aur sigmoid ki tulna mein vanishing gradient problem kam karta hai. 1 / (1 + e^−x) sigmoid hai."],
  [1,"What does the softmax function do?","Turns a vector of raw scores into probabilities that add up to 1",["Removes all negative values and keeps the rest","Picks a random class from the output","Sorts the outputs from smallest to largest"],"Model ke raw scores (logits) ko softmax probabilities mein badalta hai — jaise “cat 0.7, dog 0.2, cow 0.1”. LLMs bhi har next token ki probability softmax se hi nikalte hain."],
  [1,"Which loss function is standard for classification tasks, including next-token prediction in LLMs?","Cross-entropy loss",["Mean squared error","Hinge loss only","The absolute value of the weights"],"Cross-entropy measure karta hai ki model ne sahi class ko kitni probability di. Sahi token ko high probability = low loss. LLM training mein yahi loss minimise hota hai. MSE mostly regression ke liye hota hai."],
  [2,"What is the vanishing gradient problem?","Gradients become tiny in the early layers, so those layers barely learn",["The model forgets its training data after saving","The learning rate becomes zero automatically","Gradients become too large and overflow"],"Deep networks mein chain rule se bahut saare chhote numbers multiply hote hain (khaaskar sigmoid/tanh ke saath), toh shuru ki layers tak gradient lagbhag zero pahunchta hai. Ulta problem (bahut bade gradients) ko exploding gradient kehte hain."],
  [2,"How do residual (skip) connections help deep networks?","They give gradients a shortcut path, making very deep networks trainable",["They delete unnecessary neurons","They replace the need for an optimiser","They convert the network into a decision tree"],"Residual connection: output = layer(x) + x. Ye ek express highway jaisa hai jahan gradient bina ruke peeche tak pahunch jaata hai. ResNet aur har Transformer block yahi trick use karta hai."],
  [2,"What does dropout do during training?","Randomly switches off some neurons so the network doesn’t rely too much on any one of them",["Permanently deletes the worst-performing layer","Drops training examples that have errors","Stops training when the loss increases"],"Har step pe kuch neurons randomly band, toh baaki neurons ko bhi seekhna padta hai — team ek hi star player pe depend nahi karti. Ye overfitting kam karta hai. Inference ke time dropout off hota hai."],
  [2,"The Adam optimiser is popular because it…","Combines momentum with an adaptive learning rate for each parameter",["Needs no gradients at all","Always finds the global minimum","Works only for very small models"],"Adam do ideas jodta hai: momentum (pichli direction yaad rakhna) aur har parameter ke liye alag adaptive step size. Isliye bina zyada tuning ke kaafi accha kaam karta hai. AdamW iska common variant hai."],
  [3,"Convolutional Neural Networks (CNNs) are mainly known for…","Detecting spatial patterns in images using sliding filters",["Generating long text one word at a time","Storing data in a vector database","Ranking search results with keywords"],"CNN chhote filters image pe slide karta hai — pehli layers edges pakadti hain, aage ki layers shapes aur objects. Image classification aur detection ke liye classic choice."],
  [3,"What is a major limitation of RNNs compared with Transformers?","They process tokens one by one, so they’re slow to train and struggle with long-range dependencies",["They can’t process text at all","They have no learnable parameters","They only work on images"],"RNN ek-ek word sequence mein padhta hai, toh parallel training mushkil hai aur lambe sentences mein shuru ki baat bhool jaata hai. Transformer saare tokens ek saath dekhta hai."],
  [3,"In an LSTM, what is the job of the gates?","Deciding what information to keep, forget or output at each step",["Converting text into images","Splitting data into training and test sets","Choosing the learning rate automatically"],"LSTM (Long Short-Term Memory) mein forget, input aur output gates hote hain — jaise ek diary jisme tum decide karte ho kya rakhna hai aur kya mitaana hai. Isse lambi info better yaad rehti hai."],
  [4,"In a GAN, what are the two competing networks?","A generator that creates fake samples and a discriminator that tries to spot the fakes",["An encoder and a database","A retriever and a re-ranker","A teacher model and a student model"],"GAN (Generative Adversarial Network) = nakli note banane wala (generator) vs police (discriminator). Dono ek dusre ko beat karne ki koshish mein better hote jaate hain, aur generator realistic outputs banane lagta hai."],
  [4,"What is mode collapse in GANs?","The generator keeps producing a few similar outputs instead of diverse ones",["The discriminator stops working after training","The model forgets the training data","The images become too high resolution"],"Generator ko ek-do aise outputs mil jaate hain jo discriminator ko bewakoof bana dete hain, toh wo wahi baar baar banata hai — variety khatam. GAN training ki famous problem."],
  [4,"How do diffusion models generate images?","They learn to remove noise step by step, turning random noise into a clear image",["They copy and paste parts of training images","They search the internet for a matching image","They draw images pixel by pixel from left to right only"],"Training mein images mein dheere dheere noise milaya jaata hai, aur model ulta seekhta hai — noise hatana. Generation ke time pure noise se shuru karke step-by-step clean image banti hai. Stable Diffusion isi idea pe based hai."],
  [4,"What makes a Variational Autoencoder (VAE) generative?","It learns a smooth, probabilistic latent space that you can sample from to create new data",["It memorises every training image exactly","It uses a discriminator network","It only compresses data and can never create anything new"],"Normal autoencoder data ko compress (encode) aur wapas bana (decode) karta hai. VAE latent space ko ek smooth distribution bana deta hai, toh wahan se naya point sample karke naya output bana sakte ho. Latent space = data ka compressed “essence”."],
  [4,"How does a text-to-image model like Stable Diffusion follow your prompt?","The text is turned into embeddings that condition (guide) the denoising process",["It finds an image whose file name matches the prompt","It ignores the text and generates randomly","It converts the text into pixels letter by letter"],"Prompt ko ek text encoder (jaise CLIP) embeddings mein badalta hai, aur ye embeddings har denoising step ko guide karti hain ki image kis taraf jaaye. Stable Diffusion ye kaam compressed latent space mein karta hai, isliye fast hai."]

{
  id:"nlp", name:"NLP, tokens & embeddings",

  qs:[
  [1,"In LLMs, a token is…","A chunk of text — a word, part of a word or a character — that the model processes as one unit",["Always exactly one full English word","A password used to access the API","One complete sentence"],"Model text ko tokens mein todta hai. “unbelievable” shayad “un”, “believ”, “able” ban jaaye. Pricing, context window aur speed sab tokens mein measure hote hain."],
  [1,"As a rough rule of thumb for English text, one token is about…","4 characters, or roughly three-quarters of a word",["One full paragraph","Exactly 10 words","One byte of storage"],"Common estimate: 1 token ≈ 4 characters ≈ 0.75 words, yaani 100 tokens ≈ 75 words. Hindi jaisi languages mein aksar same content ke liye zyada tokens lagte hain."],
  [1,"How does Byte-Pair Encoding (BPE) build its vocabulary?","It starts from characters and repeatedly merges the most frequent adjacent pairs",["It uses a fixed dictionary of English words only","It assigns random IDs to every possible sentence","It splits text only at spaces"],"BPE: shuru mein har character alag, phir sabse common pair (jaise “t” + “h” → “th”) merge, phir agla, jab tak vocabulary ka size poora na ho. GPT models BPE-style tokenizers use karte hain."],
  [1,"Why do modern LLMs use subword tokenization?","It handles rare or new words by splitting them into known pieces while keeping the vocabulary a manageable size",["It makes every word exactly one token","It removes the need for embeddings","It translates text into English first"],"Har possible word ki vocabulary banana impossible hai, aur sirf characters use karna bahut lambi sequences banata hai. Subword beech ka rasta hai — naya word bhi known tukdon se ban jaata hai."],
  [1,"Which tokenization method is used by BERT?","WordPiece",["Run-length encoding","Huffman coding","JPEG compression"],"BERT WordPiece use karta hai — word ke beech ke subwords ko “##” se mark karta hai, jaise “playing” → “play”, “##ing”. GPT models BPE use karte hain, aur kai models SentencePiece."],
  [1,"Why do LLMs sometimes miscount the letters in a word like “strawberry”?","They see tokens rather than individual characters, so spelling-level detail is hidden",["They are not trained on any English words","Their context window is too small for one word","They deliberately give wrong answers"],"Model ke liye “strawberry” shayad 2–3 tokens hain, letters nahi. Isliye letter count jaise kaam mein galti hoti hai. Exact counting ke liye code ya tool use karna better hota hai."],
  [0,"What is the difference between stemming and lemmatization?","Stemming crudely chops word endings; lemmatization returns the proper dictionary base form",["They are exactly the same process","Lemmatization only works on numbers","Stemming translates words into another language"],"Stemming: “studies” → “studi” (tukda kaata, chahe word bane na bane). Lemmatization: “studies” → “study”, “better” → “good” (grammar samajh ke sahi root). Lemmatization slow par accurate hai."],
  [0,"In classical NLP, what are stop words?","Very common words like “the”, “is” and “and” that are often removed because they carry little meaning",["Words that end a sentence","Offensive words blocked by filters","Words the model has never seen"],"Stop words har jagah aate hain, toh keyword-based tasks mein unhe hata dete the. LLMs ke time mein usually nahi hatate, kyunki “not” jaise words poora meaning badal dete hain."],
  [0,"Named Entity Recognition (NER) is the task of…","Finding and labelling names of people, organisations, places, dates and so on in text",["Giving a new name to every document","Detecting the language of a text","Counting the words in a sentence"],"“Sundar Pichai joined Google in 2004” → Person: Sundar Pichai, Org: Google, Date: 2004. Pharma documents se drug names aur company names nikalna bhi NER hai."],
  [0,"Sentiment analysis means…","Classifying whether a text expresses a positive, negative or neutral opinion",["Translating text into emojis","Counting the number of sentences","Fixing grammar mistakes"],"Product reviews, tweets, feedback forms — “khaana mast tha” positive, “delivery late thi” negative. Ye ek classification task hai."],
  [0,"What is the Bag-of-Words model?","Representing text by word counts, ignoring word order",["A neural network that writes stories","A list of all stop words","A way to store images as text"],"Text ko ek thaila samjho jisme words daal diye — sirf count matter karta hai, order nahi. Toh “dog bites man” aur “man bites dog” same dikhte hain. Simple hai, par order ka meaning kho jaata hai."],
  [0,"TF-IDF gives a high weight to a word that…","Appears often in one document but rarely across the whole collection",["Appears in every single document","Is the longest word in the document","Appears only in the title"],"TF (term frequency) = document mein kitni baar aaya. IDF (inverse document frequency) = poore corpus mein kitna rare hai. “the” har jagah hai → low weight. “oncology” sirf kuch docs mein → high weight."],
  [0,"What does perplexity measure for a language model?","How well the model predicts text — lower perplexity means better prediction",["How confusing the model’s answers are to humans","The number of parameters in the model","The time taken to generate one token"],"Perplexity = model next word ke baare mein kitna “confused” hai. Low perplexity = model ko text predictable laga = accha language model. Ye cross-entropy loss se directly related hai."],
  [0,"What does an n-gram refer to?","A sequence of n consecutive words or characters, like a bigram (2 words)",["A neural network with n layers","A grammar rule with n exceptions","n copies of the same document"],"“New Delhi railway” mein bigrams: “New Delhi” aur “Delhi railway”. Purane language models aur BLEU jaise metrics n-grams pe hi chalte hain."],
  [2,"What is an embedding?","A list of numbers (a vector) that captures meaning, so similar items end up close together",["A compressed ZIP file of the text","An image inserted into a document","A unique ID number for each word"],"Embedding = text ka GPS coordinate. “dog” aur “puppy” paas paas, “dog” aur “invoice” door door. Semantic search, RAG aur clustering sab isi pe chalte hain."],
  [2,"Which classic example shows that word embeddings capture relationships?","king − man + woman ≈ queen",["cat + dog = 2 animals","apple × 2 = apples","hello − h = ello"],"Word2Vec ne dikhaya ki vectors pe maths karne se meaningful relationships milte hain — gender, capital-country, waghera. Ye prove karta hai ki embeddings meaning ko numbers mein capture karti hain."],
  [2,"Cosine similarity measures…","The angle between two vectors — 1 means pointing the same way, 0 means unrelated",["The exact distance in kilometres between two words","How many letters two words share","The length of the longest vector"],"Cosine similarity direction compare karti hai, length nahi. Embeddings compare karne ka sabse common tarika yahi hai. Value 1 ke paas = bahut similar meaning."],
  [2,"How do contextual embeddings (like BERT’s) differ from static ones (like Word2Vec)?","The same word gets a different vector depending on its sentence",["Contextual embeddings are always shorter","Static embeddings change every time you run them","Contextual embeddings ignore the surrounding words"],"Word2Vec mein “bank” ka ek hi vector — chahe river bank ho ya SBI bank. BERT surrounding words dekh ke alag vector deta hai. Isliye contextual embeddings meaning better pakadti hain."],
  [2,"When people say an embedding model has 768 or 1,536 dimensions, they mean…","Each piece of text is turned into a vector with that many numbers",["The model was trained on that many documents","The model supports that many languages","That is the maximum number of words per input"],"Dimension = vector ki length. Zyada dimensions = zyada detail capture ho sakti hai, par storage aur search ka cost bhi badhta hai."],
  [2,"Which task is a common use of sentence embeddings?","Semantic search — finding text with similar meaning even when the words differ",["Compiling Python code","Compressing videos","Encrypting passwords"],"“laptop garam ho raha hai” search karo aur “notebook overheating issue” wala document mil jaaye — words alag, meaning same. Ye embeddings ka kamaal hai; keyword search ise miss kar deta."]

{
  id:"tf", name:"Transformers & attention",
  subs:["Attention mechanism","Transformer architecture","Model families"],
  qs:[
  [1,"Which paper introduced the Transformer architecture?","“Attention Is All You Need” (2017)",["“ImageNet Classification with Deep CNNs” (2012)","“Playing Atari with Deep Reinforcement Learning” (2013)","“Generative Adversarial Nets” (2014)"],"2017 mein Google ke researchers (Vaswani et al.) ka paper. Isne RNN hata ke sirf attention pe based architecture diya, jo aaj ke saare LLMs ki neev hai."],
  [0,"What does self-attention let each token do?","Look at every other token in the sequence and decide how much each one matters to its meaning",["Ignore all other tokens and look only at itself","Look only at the very next token","Delete unimportant tokens from the input"],"“The animal didn’t cross the road because it was tired” — “it” kisko refer karta hai? Self-attention “it” ko “animal” pe zyada dhyaan dene deta hai. Har token baaki sab se context leta hai."],
  [0,"In attention, what are Query, Key and Value?","Query is what a token is looking for, Key is what each token offers, Value is the information actually passed on",["Three different training datasets","Three separate models trained in sequence","Password, username and token for the API"],"Library analogy: Query = tumhara search sawaal, Key = har kitaab ka label, Value = kitaab ka content. Query-Key match se score aata hai, aur us hisaab se Values mix hoti hain."],
  [0,"What is the formula for scaled dot-product attention?","softmax(QKᵀ / √dₖ) · V",["Q + K + V","softmax(V) · Q · K","(Q × K) − V"],"Pehle Q aur K ka dot product (similarity), phir √dₖ se divide (scaling), softmax se weights, aur un weights se V ka weighted sum. Interview mein ye formula zaroor yaad rakhna."],
  [0,"Why are attention scores divided by √dₖ?","To stop large dot products from pushing softmax into regions with tiny gradients",["To make the model use less memory","To convert the scores into integers","To randomly shuffle the tokens"],"Dimensions badi hon toh dot products bahut bade ho jaate hain, softmax ek token pe almost 1 aur baaki pe 0 de deta hai, aur gradients chhote ho jaate hain. √dₖ scaling se values balanced rehti hain."],
  [0,"What is the benefit of multi-head attention?","Several attention heads run in parallel, each able to focus on a different kind of relationship",["It lets the model use multiple GPUs automatically","It removes the need for positional information","It makes the model read text from right to left"],"Ek head grammar pe dhyaan de sakta hai, dusra coreference (“it” kisko refer kar raha), teesra paas ke words pe. Sab heads ke outputs jod ke richer understanding milti hai."],
  [0,"In decoder models like GPT, what does causal (masked) self-attention ensure?","Each token can attend only to earlier tokens, never to future ones",["Each token attends only to the last token","Tokens attend to random positions","The model sees the full answer before generating it"],"Generation ke time future words available nahi hote, toh training mein bhi future ko mask (chhupa) kar dete hain. Warna model cheating seekh lega — answer peek karke."],
  [0,"How does the compute cost of standard self-attention grow with sequence length n?","Quadratically — O(n²)",["Linearly — O(n)","It stays constant","Logarithmically — O(log n)"],"Har token baaki har token se compare hota hai, toh n × n scores. Context 2x karo toh attention ka cost ~4x. Isliye long context mehenga hai aur FlashAttention jaise optimisations aaye."],
  [0,"What is cross-attention?","Attention where the queries come from one sequence and the keys and values from another, like a decoder attending to the encoder’s output",["Attention between two different GPUs","Attention that crosses out wrong tokens","Attention used only in image models"],"Translation mein Hindi output banate waqt decoder English input (encoder ka output) ko dekhta hai — ye cross-attention hai. Text-to-image models mein bhi image, prompt pe cross-attend karti hai."],
  [1,"Why do Transformers need positional encoding?","Attention by itself has no sense of word order, so position information must be added",["To count the total number of tokens","To encrypt the input text","To decide which GPU each token goes to"],"Attention ke liye “dog bites man” aur “man bites dog” same tokens ka set hain. Positional encoding har token ko batata hai ki wo kaunse number pe khada hai."],
  [1,"RoPE (Rotary Positional Embedding), used in models like LLaMA, works by…","Rotating query and key vectors by an angle that depends on each token’s position",["Adding a random number to each token","Sorting tokens alphabetically","Repeating each token twice"],"RoPE Q aur K vectors ko position ke hisaab se rotate karta hai, toh attention score mein do tokens ke beech ka relative distance naturally aa jaata hai. LLaMA aur Mistral jaise models ise use karte hain."],
  [1,"What is a key advantage of Transformers over RNNs?","All tokens are processed in parallel during training, and long-range links are easier to learn",["They need no training data","They have fewer parameters than any RNN","They only work with numbers, not text"],"RNN line mein khade logon jaise ek-ek karke kaam karta hai; Transformer sab ko ek saath. GPUs parallel kaam mein maahir hain, isliye Transformers bahut bade data pe train ho paaye."],
  [1,"Inside each Transformer block, after attention, what does the feed-forward network do?","Processes each token’s representation independently through a small MLP",["Sends the tokens to an external database","Generates the final answer directly","Shuffles the tokens into a new order"],"Attention tokens ke beech info mix karta hai; feed-forward network (MLP) har token ko alag se aur process karta hai. Model ke zyaadatar parameters aksar inhi layers mein hote hain. Saath mein residual connections aur layer norm bhi hote hain."],
  [1,"What is the KV cache used for during LLM inference?","Storing the keys and values of previous tokens so they aren’t recomputed for every new token",["Caching the user’s login details","Saving the final answer to disk","Storing the training dataset"],"Har naya token banate waqt pichle tokens ke K aur V dobara compute karna waste hai. KV cache unhe memory mein rakhta hai — generation fast, par long context mein GPU memory zyada khaata hai."],
  [1,"In a Mixture-of-Experts (MoE) model, what happens to each token?","A router sends it to only a few expert sub-networks, so only part of the model runs per token",["It is processed by every expert one after another","It is sent to a human expert for review","It is split into characters, each going to a different expert"],"MoE mein bahut saare experts hote hain par har token ke liye router sirf 1–2 chunta hai. Total parameters bade, par per-token compute kam. Mixtral jaisa model isi tarah ka hai."],
  [2,"BERT is an example of which kind of Transformer?","Encoder-only",["Decoder-only","A GAN","A recurrent network"],"BERT sirf encoder use karta hai aur text ko dono taraf se (bidirectional) dekhta hai. Isliye understanding tasks — classification, NER, embeddings — mein accha hai, par lamba text generate karne ke liye nahi bana."],
  [2,"The GPT family of models is…","Decoder-only",["Encoder-only","Encoder-decoder","A convolutional network"],"GPT = Generative Pre-trained Transformer. Sirf decoder stack, causal attention ke saath, next token predict karta hai. Aaj ke zyaadatar chat LLMs decoder-only hain."],
  [2,"Which model is a well-known encoder-decoder Transformer?","T5",["GPT-2","BERT","Word2Vec"],"T5 har task ko text-to-text banata hai: input text encoder mein, output text decoder se. BART bhi encoder-decoder hai. Translation aur summarisation ke liye natural fit."],
  [2,"What is BERT’s main pretraining objective?","Masked language modelling — predicting words that were hidden in the sentence",["Predicting only the next word from left to right","Generating images from captions","Ranking web pages"],"Sentence ke ~15% words [MASK] kar diye, aur model dono taraf ka context dekh ke guess karta hai — fill-in-the-blanks jaisa. Original BERT mein Next Sentence Prediction bhi tha."],
  [2,"What is the pretraining objective of GPT-style models?","Predicting the next token given all the previous tokens",["Filling in randomly masked words using both sides","Classifying images into categories","Translating between two fixed languages"],"Causal language modelling: “Mera naam Rahul ___” → next token predict karo. Simple objective, par huge data pe isse grammar, facts aur reasoning patterns sab seekhne ko milte hain."]
