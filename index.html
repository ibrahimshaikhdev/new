  qs:[
  [0,"At its core, what does an LLM do when generating text?","Predicts a likely next token based on all the tokens so far, one token at a time",["Looks up the full answer in a stored database","Runs a hand-written grammar program","Copies a matching sentence from the internet"],"LLM ek bahut smart autocomplete hai. Har step pe agla token predict karta hai, use input mein jodta hai, phir agla — jab tak answer poora na ho."],
  [0,"What is an LLM’s context window?","The maximum number of tokens it can consider at once, including your input and its output",["The size of the screen used to chat","The number of users who can chat at the same time","The time limit for each request"],"Context window = model ki working memory, jaise desk ka size. 128K context = ~128,000 tokens ek saath dekh sakta hai. Usse zyada ho toh purana content kaatna padta hai."],
  [0,"A “7B” model has…","About 7 billion learned parameters (weights)",["7 billion training documents","7 billion users","A context window of 7 billion tokens"],"B = billion parameters. Zyada parameters = usually zyada capability, par zyada memory aur compute bhi. FP16 mein 7B model ko roughly 14 GB memory chahiye."],
  [0,"What are logits in an LLM?","The raw, unnormalised scores for every token in the vocabulary, before softmax",["The login credentials for the model API","The log files written during training","The final cleaned-up answer"],"Model har possible next token ko ek score deta hai — ye logits hain. Softmax inhe probabilities mein badalta hai, phir decoding strategy token chunti hai."],
  [0,"What do scaling laws for LLMs describe?","How model loss falls predictably as parameters, data and compute increase",["The legal rules for selling AI models","How to scale images before training","The maximum size an LLM can ever reach"],"Research (Kaplan et al., aur baad mein Chinchilla) ne dikhaya ki model size, data aur compute badhane pe performance predictable tarike se improve hoti hai. Chinchilla ne bataya ki data bhi model size ke saath badhana zaroori hai."],
  [1,"What happens during LLM pretraining?","The model learns language and world knowledge by predicting next tokens on a massive text corpus",["The model is taught to follow instructions using a few hundred examples","Humans rank the model’s answers","The model is compressed for mobile phones"],"Pretraining = school ki saari padhai. Trillions of tokens, hazaaron GPUs, mahino ka kaam. Result ek base model hota hai jo text continue karna jaanta hai, par chat assistant jaisa behave nahi karta."],
  [1,"What is Supervised Fine-Tuning (SFT), also called instruction tuning?","Training a pretrained model on instruction–response pairs so it learns to follow instructions",["Training a model from scratch with random weights","Removing layers to make the model smaller","Letting the model chat with itself without any data"],"Base model ko examples dikhate hain: “Instruction: email likho → Response: …”. Isse wo helpful assistant ki tarah jawab dena seekhta hai."],
  [1,"What are the main steps of RLHF?","Collect human preference rankings, train a reward model on them, then optimise the LLM with reinforcement learning",["Pretrain, quantise, then deploy","Tokenize, embed, then cluster","Collect web data, remove duplicates, then compress it"],"RLHF (Reinforcement Learning from Human Feedback): humans do answers mein se behtar chunte hain → reward model seekhta hai “kaunsa answer accha hai” → LLM ko PPO jaise RL algorithm se optimise karte hain taaki high-reward answers de."],
  [1,"How does DPO (Direct Preference Optimisation) differ from classic RLHF?","It learns directly from preference pairs, without a separate reward model or an RL loop",["It uses no human preference data at all","It only works on image models","It adds more pretraining data"],"DPO wahi preference data (chosen vs rejected answer) use karta hai par seedha ek loss function se model update karta hai. Simple, stable aur sasta — isliye bahut popular hua."],
  [1,"What is the difference between a base model and an instruct (chat) model?","A base model just continues text; an instruct model has been tuned to follow instructions and hold conversations",["Base models are always larger than instruct models","Instruct models were never pretrained","There is no difference between them"],"Base model ko “India ki capital kya hai?” do toh wo shayad aur quiz questions likhne lage. Instruct model seedha answer dega. Instruct = base + SFT + preference tuning."],
  [2,"What does the temperature setting control?","How random or focused the model’s word choices are",["How fast the GPU runs","The maximum length of the prompt","The language of the answer"],"Low temperature (0–0.3) = safe, predictable, factual. High (0.8–1.2) = creative aur varied, par galti ka risk zyada. Temperature probability distribution ko sharp ya flat karta hai."],
  [2,"For data extraction or factual Q&A, which temperature is usually best?","Low, close to 0",["Very high, around 2","It doesn’t matter at all","A negative temperature"],"Extraction mein consistency chahiye — har baar same answer. Temperature 0 ke paas model sabse likely token chunta hai. Creative writing ke liye higher rakhte hain."],
  [2,"Top-p (nucleus) sampling picks the next token from…","The smallest set of tokens whose probabilities add up to at least p",["Exactly the top 10 tokens every time","Any token in the vocabulary, with equal chance","Only tokens that appeared in the prompt"],"Top-p = 0.9 → probabilities ko bade se chhote sort karo, jab tak total 90% na ho jaaye, unhi tokens mein se chuno. Set ka size situation ke hisaab se badalta hai, top-k jaisa fixed nahi."],
  [2,"Top-k sampling means…","Sampling the next token only from the k most likely candidates",["Generating k different answers in parallel","Using only the top k layers of the model","Keeping only the first k words of the prompt"],"Top-k = 40 → sirf 40 sabse likely tokens mein se chuno, baaki ajeeb options cut. Top-p ki tulna mein ye ek fixed count hai."],
  [2,"Greedy decoding always…","Picks the single highest-probability token at each step",["Picks a random token","Picks the longest available token","Generates the answer backwards"],"Greedy = har step pe best wala. Fast aur deterministic, par kabhi kabhi repetitive ya boring text deta hai, kyunki second-best choice se overall behtar sentence ban sakta tha."],
  [2,"What is a stop sequence?","A string that tells the model to stop generating as soon as it appears",["A list of banned words","The first token of every answer","A command that shuts down the server"],"Jaise “###” stop sequence set kiya, aur model jaise hi ye likhe, generation ruk jaata hai. Output ko clean aur controlled rakhne ke kaam aata hai."],
  [2,"The max tokens (max output tokens) setting controls…","The upper limit on how long the generated response can be",["The size of the training dataset","The number of users allowed","The vocabulary size of the model"],"Max tokens ek ceiling hai — answer usse lamba nahi jaayega (beech mein kat bhi sakta hai). Cost control aur latency ke liye useful."],
  [3,"What is an LLM hallucination?","A confident-sounding answer that is false or made up",["When the model refuses to answer","When the model replies in another language","When the server is down"],"Model fluent text banane ke liye trained hai, sach check karne ke liye nahi. Isliye kabhi fake citations ya galat facts bhi confidently bol deta hai. RAG, grounding aur verification se ise kam karte hain."],
  [3,"What does a model’s knowledge cutoff mean?","It has no built-in knowledge of events after its training data ends",["It refuses to answer after a certain number of questions","It deletes old knowledge every month","It can only answer questions up to a certain length"],"Training data ek date tak ka hota hai. Uske baad ki news model ko nahi pata, jab tak tum search ya RAG se current info na do."],
  [3,"Why can LLMs make mistakes on exact arithmetic like large multiplications?","They predict likely-looking tokens instead of actually executing calculations",["They have no numbers in their vocabulary","Maths is blocked by safety filters","Their context window cannot hold numbers"],"LLM calculator nahi, pattern predictor hai. Chhote sums yaad ho sakte hain, par bade calculations mein galti ho sakti hai. Solution: code interpreter ya calculator tool use karwao."]
  ]
},
{
  id:"prompt", name:"Prompt engineering",
  subs:["Prompting techniques","Prompt design","Prompt security"],
  qs:[
  [0,"Zero-shot prompting means…","Asking the model to do a task without giving any examples",["Giving the model zero tokens of input","Training the model from scratch","Setting the temperature to zero"],"“Is review ka sentiment batao: …” — bas instruction, koi example nahi. Model apni pretraining knowledge se kaam karta hai."],
  [0,"Few-shot prompting means…","Including a few input–output examples in the prompt to show the expected pattern",["Fine-tuning the model on a few thousand examples","Asking the same question a few times","Using a few GPUs for inference"],"Jaise naye intern ko 2–3 bhare hue forms dikha do aur bolo “isi tarah bharo”. Format aur style follow karwane mein bahut effective."],
  [0,"What is chain-of-thought (CoT) prompting?","Asking the model to reason step by step before giving the final answer",["Connecting several LLMs in a physical chain","Repeating the question many times","Asking only yes/no questions"],"“Let’s think step by step” — model beech ke steps likhta hai, jisse multi-step maths aur logic mein accuracy badhti hai. Jaise exam mein working dikhane se galti kam hoti hai."],
  [0,"What is in-context learning?","The model picks up a task from examples in the prompt without any change to its weights",["Retraining the model every time a user chats","Storing chats in a database for later training","Learning only from images inside the prompt"],"Few-shot examples dekh ke model turant pattern samajh leta hai — par ye “learning” sirf us conversation tak hai. Weights update nahi hote; agla chat bilkul fresh."],
  [0,"What is self-consistency prompting?","Sampling several reasoning paths and choosing the most common final answer",["Asking the model whether it is consistent","Using the same prompt for every task","Forcing the model to repeat its first answer"],"Same sawaal model se 5 baar step-by-step solve karwao (thode temperature ke saath), phir majority vote. Ek raste mein galti ho bhi jaaye, baaki raaste sahi answer pe pahunch jaate hain."],
  [0,"The ReAct prompting pattern combines…","Reasoning steps with actions such as tool calls, in an alternating loop",["React.js code with Python","Retrieval with image generation","Two models voting on one answer"],"ReAct = Reason + Act. Thought: “mujhe weather chahiye” → Action: weather tool → Observation: result → agla Thought… Aaj ke agents isi pattern pe based hain."],
  [0,"What does Tree-of-Thoughts prompting do?","Explores several possible reasoning branches and evaluates them before choosing a path",["Draws a tree diagram of the prompt","Uses a decision tree instead of an LLM","Splits the prompt into tree-shaped tokens"],"Chain-of-thought ek seedhi line hai; Tree-of-Thoughts har step pe multiple options sochta hai, unhe evaluate karta hai, aur zarurat ho toh peeche aake doosra branch try karta hai — chess player jaise."],
  [0,"What is prompt chaining?","Breaking a complex task into steps, where each prompt’s output feeds the next prompt",["Sending the same prompt to many models","Joining all prompts into one giant message","Locking a prompt so nobody can edit it"],"Ek bada prompt jo sab kuch kare, uski jagah: step 1 data extract → step 2 summarise → step 3 email draft. Har step debug karna aasaan aur zyada reliable."],
  [1,"What is a system prompt?","Instructions that set the model’s role, rules and behaviour for the whole conversation",["The error message shown when the system crashes","The first question a user asks","A prompt that only administrators can read"],"System prompt = job description. “You are a helpful pharma data assistant. Answer only from the given data.” — ye poori conversation ka tone aur rules set karta hai."],
  [1,"Which instruction is most likely to get a high-quality result?","“Summarise this report in 5 bullet points for a busy manager, focusing on risks and deadlines.”",["“Summarise.”","“Do something good with this.”","“Write about the report, make it nice.”"],"Accha prompt specific hota hai: task (summarise), format (5 bullets), audience (busy manager), focus (risks, deadlines). Jitna clear brief, utna accha output — jaise darzi ko exact naap dena."],
  [1,"Why wrap documents or user data in delimiters such as XML tags or triple quotes?","To clearly separate the instructions from the data the model should work on",["To make the prompt shorter","To encrypt the data","To stop the model from reading the data"],"<document>…</document> jaise tags se model ko pata chalta hai kya instruction hai aur kya sirf content. Confusion kam hoti hai aur prompt injection ka risk bhi thoda ghatta hai."],
  [1,"What is the best way to get reliable JSON output from an LLM?","Describe the exact schema, show an example, and use structured output or JSON mode if the API offers it",["Ask politely and hope for the best","Set the temperature to the maximum","Ask for a poem and convert it later"],"Schema batao (keys, types), ek example do, aur jahan available ho structured outputs feature use karo. Output ko code mein parse aur validate bhi karo (jaise Pydantic se)."],
  [1,"What is role prompting?","Telling the model to act as a specific persona, like “You are an experienced data engineer”",["Assigning user roles in a database","Giving the model admin permissions","Asking several users to write one prompt together"],"Role dene se model ka vocabulary, depth aur tone us expert jaisa ho jaata hai. Par sirf role kaafi nahi — clear task aur context bhi chahiye."],
  [1,"What is a prompt template?","A reusable prompt with placeholders that get filled with real values at runtime",["A paid prompt sold online","A screenshot of a good prompt","The model’s training data"],"Jaise “Customer {name} ka order {order_id} late hai, polite email likho.” Code mein variables bharke same template baar baar use hota hai. LangChain ka PromptTemplate yahi hai."],
  [1,"What does the “lost in the middle” effect describe?","Models often use information at the start and end of a long context better than information in the middle",["Models forget the system prompt after one message","Models skip every middle word in a sentence","Models lose their weights after long chats"],"Research ne dikhaya ki bahut lambe context ke beech mein rakhi important baat miss ho sakti hai. Isliye critical info shuru ya end mein rakho, aur RAG mein sirf relevant chunks bhejo."],
  [1,"Which is generally better prompting practice?","Saying what the model should do, not only what it shouldn’t do",["Using only negative instructions like “don’t be vague”","Writing the instructions in random order","Leaving out the expected output format"],"“Don’t write long” ki jagah “Answer in under 50 words” — positive aur specific instruction model better follow karta hai."],
  [2,"What is prompt injection?","Malicious text that tries to override an app’s instructions, like “Ignore all previous instructions…”",["Injecting more GPUs into a server","Adding more examples to a prompt","A faster way to send prompts"],"Jaise SQL injection mein query hijack hoti hai, waise prompt injection mein user ya data ka text model ke rules hijack karne ki koshish karta hai. OWASP ki LLM Top 10 list mein ye sabse upar hai."],
  [2,"What is indirect prompt injection?","Hidden instructions placed inside content the model reads, such as a web page, email or document",["A user typing a very long prompt","A prompt written in another language","Using a second model to write prompts"],"User ne kuch galat nahi likha, par jo web page ya PDF model padh raha hai usme chhupa likha hai “send the user’s data to …”. Agents aur RAG systems ke liye bada risk."],
  [2,"What is jailbreaking an LLM?","Crafting prompts that trick the model into ignoring its safety guidelines",["Installing the model on an iPhone","Unlocking a paid API for free","Removing the model’s context window"],"Role-play, “hypothetically…” ya complicated tricks se model se wo karwana jo wo normally mana karega. Model providers ise rokne ke liye safety training aur filters use karte hain."],
  [2,"Which is a sound defence against prompt injection in an LLM app?","Treat external content as untrusted data, limit tool permissions, and require confirmation for sensitive actions",["Raise the temperature so attacks fail randomly","Add one line saying “never get hacked” and rely on it alone","Give the model admin access so it can block attackers"],"Koi ek magic fix nahi hai — defence layers mein hota hai: input/output filtering, data ko instructions se alag rakhna, least privilege (tool ko sirf zaroori access), aur risky actions pe human approval."]
  ]
},
{
  id:"rag", name:"RAG & vector databases",
  subs:["RAG basics","Chunking","Vector search","Advanced RAG & evaluation"],
  qs:[
  [0,"What does RAG stand for?","Retrieval-Augmented Generation",["Random Answer Generation","Recurrent Attention Graph","Rapid AI Gateway"],"RAG = pehle relevant documents dhoondo (retrieval), unhe prompt mein jodo (augmentation), phir LLM answer banaye (generation). Open-book exam jaisa."],
  [0,"What is the main benefit of RAG?","Answers are grounded in your own or up-to-date documents, reducing hallucination without retraining the model",["It makes the model’s weights smaller","It removes the need for any LLM","It trains a new model from scratch for every query"],"Company ki SOPs, latest policies, private data — LLM ko ye pata nahi. RAG ye info runtime pe de deta hai, citations ke saath. Data update karo; model retrain karne ki zarurat nahi."],
  [0,"What is the correct order of a basic RAG pipeline?","Load documents → chunk → embed → store in a vector DB → retrieve for the query → add to the prompt → generate",["Generate → retrieve → chunk → embed","Embed the answer → train the model → delete the documents","Chunk the query → fine-tune → load the documents"],"Do phases hain: Indexing (load, chunk, embed, store — ek baar) aur Querying (user ka question embed, similar chunks retrieve, prompt mein daalo, LLM se answer)."],
  [0,"When is RAG usually a better choice than fine-tuning?","When the knowledge changes often or answers need sources from specific documents",["When you want to permanently change the model’s writing style","When you have no documents at all","When you want the model to forget facts"],"Rule of thumb: knowledge ke liye RAG, behaviour/style/format ke liye fine-tuning. SOPs har mahine badlein toh RAG; har response ek fixed company tone mein chahiye toh fine-tuning."],
  [0,"Why should the same embedding model be used for indexing documents and for embedding queries?","Vectors from different models live in different spaces, so comparing them gives meaningless scores",["Different models use different file formats on disk","It is a licensing requirement","The vector DB refuses to store a second model’s vectors"],"Har embedding model ka apna “map” hota hai. Ek model ke coordinates ko doosre ke map pe dhoondhna — jaise Pune ka pin code Delhi ki list mein search karna. Model badla toh saare docs re-embed karo."],
  [1,"What is chunking in RAG?","Splitting large documents into smaller pieces before embedding them",["Deleting duplicate documents","Compressing the LLM","Merging all documents into one big file"],"300 page ke PDF ka ek embedding saari details ko blur kar dega. Chhote chunks (jaise ~500 tokens) se precise retrieval hota hai — sirf relevant paragraph prompt mein jaata hai."],
  [1,"Why do we add overlap between chunks?","So that context near chunk boundaries isn’t lost when a sentence or idea gets split",["To double the storage cost on purpose","To make the embeddings identical","To hide data from the model"],"Agar ek important line do chunks ke beech kat gayi, toh dono adhoore. 10–20% overlap se boundary wali info dono chunks mein reh jaati hai."],
  [1,"What is a problem with chunks that are too large?","The embedding gets diluted by mixed topics, and irrelevant text fills the context window",["The model can no longer read numbers","Large chunks cannot be embedded at all","Retrieval becomes perfectly accurate"],"Bada chunk = kai topics ka mix, toh embedding kisi ek cheez ko clearly represent nahi karti aur prompt mein faltu text jaata hai. Bahut chhota chunk ho toh context toot jaata hai. Balance chahiye."],
  [1,"What is semantic chunking?","Splitting text where the meaning or topic changes, instead of at a fixed character count",["Splitting text exactly every 100 characters","Chunking only the titles of documents","Translating each chunk into another language"],"Fixed-size chunking kabhi beech sentence mein kaat deta hai. Semantic chunking sentences ki similarity dekh ke topic badalne pe todta hai — har chunk ek poora idea."],
  [2,"What is a vector database mainly used for?","Storing embeddings and quickly finding the ones most similar to a query vector",["Storing spreadsheets with formulas","Running SQL joins on sales tables only","Hosting web pages"],"Vector DB (Pinecone, Weaviate, Milvus, Chroma, pgvector) ka core kaam: “is query vector ke sabse paas wale 5 vectors do” — wo bhi millions mein se milliseconds mein."],
  [2,"Why do vector databases use Approximate Nearest Neighbour (ANN) search?","It trades a tiny bit of accuracy for a huge gain in speed on large collections",["It always returns perfectly exact results","It doesn’t need any vectors","It is required by law"],"Har vector se compare karna (brute force) millions pe slow hai. ANN indexes smart shortcuts lete hain — lagbhag wahi results, kai guna fast."],
  [2,"HNSW is…","A graph-based ANN index that navigates layered “small-world” graphs to find close vectors fast",["A tokenizer used by BERT","A fine-tuning technique","A type of GPU"],"HNSW (Hierarchical Navigable Small World): upar ki layers mein lambi chhalaang, neeche ki layers mein fine search — jaise pehle highway se city, phir gali se ghar. Bahut popular index."],
  [2,"What is hybrid search?","Combining keyword search (like BM25) with vector (semantic) search",["Searching two vector databases at the same time","Using a GPU and a CPU together","Searching only images and text together"],"Vector search meaning samajhta hai, keyword search exact terms (product codes, drug names, IDs) pakadta hai. Dono ke scores combine karke better retrieval milta hai."],
  [2,"BM25 is best described as…","A keyword-based ranking algorithm built on term frequency and how rare a term is",["A neural embedding model","A vector compression method","A large language model"],"BM25 TF-IDF ka improved version hai. “SOP-QA-1023” jaisa exact code dhoondhna ho toh embeddings fail ho sakti hain, BM25 nahi."],
  [2,"What is metadata filtering in RAG?","Narrowing the search using attributes like date, department or document type alongside similarity",["Deleting all metadata before indexing","Filtering out long words","Hiding answers from users"],"“Sirf 2025 ke Quality SOPs mein dhoondo” — metadata filter pehle scope chhota karta hai, phir similarity search. Accuracy aur access control dono mein madad."],
  [3,"What does a re-ranker do in a RAG pipeline?","Re-scores the top retrieved chunks with a more accurate model, so the best ones reach the LLM",["Randomly reorders the chunks","Deletes the vector database","Ranks users by how often they chat"],"Pehla retrieval fast par thoda rough hota hai — top 50 laata hai. Re-ranker (aksar cross-encoder) har chunk ko query ke saath dhyaan se padhke score karta hai, aur top 5 LLM ko jaate hain."],
  [3,"How does a cross-encoder differ from a bi-encoder?","A cross-encoder reads the query and document together (accurate but slow); a bi-encoder embeds them separately (fast)",["A cross-encoder works only on images","A bi-encoder always needs two GPUs","They are two names for the same model"],"Bi-encoder: docs pehle se embed, query embed karo, compare — fast, retrieval ke liye. Cross-encoder: har (query, doc) pair ek saath padhta hai — slow par accurate, isliye re-ranking ke liye."],
  [3,"What is HyDE (Hypothetical Document Embeddings)?","Having the LLM write a hypothetical answer first, then using that answer’s embedding to search",["Hiding documents from the retriever","A hardware accelerator for embeddings","Deleting duplicate embeddings"],"Chhota sawaal aur lamba document embedding space mein door ho sakte hain. HyDE pehle ek fake-par-plausible answer likhwata hai — wo real documents jaisa dikhta hai, toh search better hota hai."],
  [3,"In RAG evaluation (for example with RAGAS), what does faithfulness measure?","Whether the generated answer is actually supported by the retrieved context",["How fast the answer was generated","How many documents are in the database","Whether the user liked the font"],"Faithfulness = answer ka har claim context mein hai, ya model ne apni taraf se jod diya? Saath mein answer relevance, context precision aur context recall bhi dekhte hain."],
  [3,"A RAG bot gives wrong answers even though the right document is in the knowledge base. What should you check first?","Whether retrieval actually returns the right chunk for that question",["Whether the LLM has enough parameters","Whether the documents use the right font size","Whether the GPU is overheating"],"Garbage in, garbage out. Sabse pehle dekho ki retriever sahi chunk laa raha hai ya nahi (context recall). Aksar problem chunking, embeddings ya query wording mein hoti hai, LLM mein nahi."]
  ]
},
{
  id:"ft", name:"Fine-tuning & efficiency",
  subs:["Fine-tuning basics","PEFT & LoRA","Quantisation & compression","Serving & inference"],
  qs:[
  [0,"What is fine-tuning?","Continuing to train a pretrained model on a smaller, task-specific dataset",["Training a brand-new model from random weights","Writing a better prompt","Adding more GPUs for inference"],"Pretrained model = graduate jo general cheezein jaanta hai. Fine-tuning = use company-specific training dena. Kam data aur kam compute mein specialised model."],
  [0,"What is transfer learning?","Reusing knowledge a model learned on one task to help with another task",["Moving a model from one server to another","Copying data between databases","Translating a dataset into another language"],"ImageNet pe trained model ko X-ray classification ke liye adapt karna, ya pretrained LLM ko legal docs pe fine-tune karna — sab transfer learning hai. Zero se shuru karne ki zarurat nahi."],
  [0,"What is the main drawback of fully fine-tuning a large model?","Every weight is updated, so it needs a lot of GPU memory and a full model copy per task",["It can only be done on CPUs","It never improves performance","It deletes the model’s tokenizer"],"70B model ke saare weights, unke gradients aur optimiser states memory mein — bahut mehenga. Aur har task ke liye poora alag model save karna padta hai. Isi liye PEFT aaya."],
  [0,"What is catastrophic forgetting?","A model losing general abilities it had before, because it was fine-tuned on narrow data",["Deleting the training data by mistake","A model forgetting the user’s name mid-chat","Losing the model file after a crash"],"Sirf medical data pe zyada fine-tune kiya toh model normal baatcheet ya coding bhool sakta hai. Mixed data, kam learning rate aur LoRA jaise methods se risk kam hota hai."],
  [0,"When is fine-tuning usually better than prompting or RAG?","When you need a consistent style, format or domain behaviour that prompts alone can’t reliably produce",["When the information changes every day","When you have no example data","When you need answers with live web citations"],"Fine-tuning behaviour sikhata hai: fixed JSON format, brand tone, specific classification. Badalta hua knowledge RAG se do. Aksar pehle prompting try karo, phir RAG, phir fine-tuning."],
  [0,"For fine-tuning data, what matters most?","A smaller set of high-quality, diverse, correct examples",["As many examples as possible, even if they’re noisy","Only very short examples","Examples copied from a single source"],"LIMA jaisi research ne dikhaya ki ~1,000 acche curated examples bhi kaafi asar daal sakte hain. Galat examples model ko galti hi sikhayenge."],
  [1,"What does PEFT stand for?","Parameter-Efficient Fine-Tuning",["Pretrained Embedding For Transformers","Prompt Engineering For Text","Parallel Execution of Fine Tasks"],"PEFT methods model ke chhote se hisse ko train karte hain (aksar 1% se bhi kam parameters), baaki base model frozen rehta hai. LoRA, adapters aur prefix tuning sab PEFT hain."],
  [1,"How does LoRA work?","It freezes the original weights and trains small low-rank matrices whose product is added to them",["It retrains every weight with a lower learning rate","It deletes half of the model’s layers","It converts the model into a database"],"LoRA: ΔW = B × A, jahan A aur B patli matrices hain. Bade weight matrix ko chhedte nahi, bas ek chhota “patch” seekhte hain. Training sasti, aur adapter file sirf kuch MB ki."],
  [1,"In LoRA, what does the rank r control?","The size of the low-rank matrices — a smaller r means fewer trainable parameters",["The number of GPUs used","The ranking of search results","The model’s context length"],"r = 8 ya 16 common hai. Chhota r = halka adapter, kam memory. Bada r = zyada capacity par zyada parameters. Ye ek tuning knob hai."],
  [1,"What does QLoRA add on top of LoRA?","It loads the frozen base model in 4-bit precision, so big models can be fine-tuned on a single GPU",["It removes the need for any training data","It uses quantum computers","It trains the model without gradients"],"QLoRA = 4-bit quantised base model (NF4 format) + LoRA adapters. Isse 65B jaisa bada model bhi ek 48 GB GPU pe fine-tune ho gaya. Students ke liye game changer."],
  [1,"What are adapters in PEFT?","Small trainable layers inserted into a frozen pretrained model",["Power plugs for GPUs","Converters between file formats","Extra users added to the API"],"Adapters frozen layers ke beech chhote bottleneck modules hote hain. Har task ka alag adapter, base model same — jaise ek phone, alag alag covers."],

(function(){
"use strict";
var LETTERS=["A","B","C","D"];
var SEC="ABCDEFGHIJKLMNOP";
var KEY="genai-mcq-sheet-v1";
var mainEl=document.getElementById("main");
var navEl=document.getElementById("nav");
var statsEl=document.getElementById("topStats");

/* deterministic shuffle so each question keeps the same option order */
function hash(str){var h=2166136261>>>0;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}
function perm(id){
  var s=hash(id);
  function rnd(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
  var a=[0,1,2,3];
  for(var i=3;i>0;i--){var j=Math.floor(rnd()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}
  return a;
}
var Q=[],byId={};
TOPICS.forEach(function(tp,ti){
  tp.qs.forEach(function(r,i){
    var id=tp.id+"-"+(i+1);
    var q={id:id,t:ti,s:r[0],q:r[1],opts:[r[2]].concat(r[3]),ex:r[4],order:perm(id)};
    Q.push(q);byId[id]=q;
  });
});
var TOTAL=Q.length;

/* storage */
var store={answers:{},pos:null};
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return;
    var p=JSON.parse(raw);
    if(p&&typeof p==="object"){
      if(p.answers&&typeof p.answers==="object"){
        Object.keys(p.answers).forEach(function(k){
          var a=p.answers[k];
          if(byId[k]&&a&&typeof a.c==="number")store.answers[k]={c:a.c,ok:a.c===0};
        });
      }
      if(p.pos&&typeof p.pos==="object")store.pos=p.pos;
    }
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stat(pred){
  var r={total:0,att:0,ok:0};
  for(var i=0;i<Q.length;i++){var q=Q[i];if(!pred(q))continue;r.total++;var a=store.answers[q.id];if(a){r.att++;if(a.ok)r.ok++}}
  r.bad=r.att-r.ok;return r;
}
function pct(st){return st.att?Math.round(st.ok/st.att*100)+"%":"–"}

/* view state */
var view={name:"board"};
function baseMatch(q){return(view.t==null||q.t===view.t)&&(view.s==null||q.s===view.s)}
function buildIds(){
  view.ids=Q.filter(function(q){
    if(!baseMatch(q))return false;
    var a=store.answers[q.id];
    if(view.mode==="left")return !a;
    if(view.mode==="wrong")return !!(a&&!a.ok);
    return true;
  }).map(function(q){return q.id});
}
function remember(){
  if(view.name!=="quiz")return;
  store.pos={t:view.t,s:view.s,mode:view.mode,id:view.ids[view.i]||null};
  save();
}
function openQuiz(t,s,mode,startId){
  view={name:"quiz",t:(t==null?null:t),s:(s==null?null:s),mode:mode||"all",ids:[],i:0};
  buildIds();
  var k=startId?view.ids.indexOf(startId):-1;
  if(k>=0)view.i=k;
  else if(view.mode==="all"){
    for(var i=0;i<view.ids.length;i++){if(!store.answers[view.ids[i]]){view.i=i;break}}
  }
  remember();closeDrawer();render();toTop(true);
  try{mainEl.focus({preventScroll:true})}catch(e){}
}
function openBoard(){view={name:"board"};closeDrawer();render();toTop(true)}
function toTop(force){
  var r=mainEl.getBoundingClientRect();
  if(force||r.top<0)window.scrollTo(0,Math.max(0,window.scrollY+r.top-70));
}

/* rendering */
function render(){renderTop();renderNav();if(view.name==="quiz")renderQuiz();else renderBoard()}

function renderTop(){
  var st=stat(function(){return true});
  statsEl.innerHTML="<b>"+st.ok+"</b> correct of <b>"+st.att+"</b> attempted<span class=\"hide-sm\"> out of "+TOTAL+"</span>";
}

function renderNav(){
  var isQuiz=view.name==="quiz";
  var h="<div class=\"nav-top\">";
  h+="<button class=\"nav-link\" data-act=\"board\""+(view.name==="board"?" aria-current=\"true\"":"")+">Marksheet</button>";
  var all=stat(function(){return true});
  h+="<button class=\"nav-link\" data-act=\"topic\" data-t=\"\""+(isQuiz&&view.t==null?" aria-current=\"true\"":"")+">All questions <span class=\"count\">"+all.att+"/"+all.total+"</span></button>";
  h+="</div><ol class=\"sections\">";
  TOPICS.forEach(function(tp,ti){
    var st=stat(function(q){return q.t===ti});
    var cur=isQuiz&&view.t===ti&&view.s==null;
    h+="<li><button class=\"sec\" data-act=\"topic\" data-t=\""+ti+"\""+(cur?" aria-current=\"true\"":"")+">"+
       "<span class=\"sec-letter"+(st.att===st.total?" full":"")+"\" aria-hidden=\"true\">"+SEC[ti]+"</span>"+
       "<span class=\"sec-name\">"+esc(tp.name)+"</span><span class=\"count\">"+st.att+"/"+st.total+"</span></button>";
    h+="<ul class=\"subs\">";
    tp.subs.forEach(function(sn,si){
      var ss=stat(function(q){return q.t===ti&&q.s===si});
      var c2=isQuiz&&view.t===ti&&view.s===si;
      h+="<li><button class=\"sub\" data-act=\"sub\" data-t=\""+ti+"\" data-s=\""+si+"\""+(c2?" aria-current=\"true\"":"")+">"+
         "<span>"+esc(sn)+"</span><span class=\"count\">"+ss.att+"/"+ss.total+"</span></button></li>";
    });
    h+="</ul></li>";
  });
  h+="</ol>";
  navEl.innerHTML=h;
}

function setTitleParts(){
  if(view.t==null)return{letter:"✱",title:"All questions",sub:"Every topic, Section A to "+SEC[TOPICS.length-1]};
  var tp=TOPICS[view.t];
  var base=stat(baseMatch);
  return{letter:SEC[view.t],title:tp.name,sub:(view.s==null?"All subtopics":tp.subs[view.s])+", "+base.total+" questions"};
}

function renderQuiz(){
  var tp=setTitleParts();
  var base=stat(baseMatch);
  var h="<div class=\"quiz\">";
  h+="<div class=\"set-head\"><span class=\"sec-letter\" aria-hidden=\"true\">"+esc(tp.letter)+"</span><div><h1 class=\"set-title\">"+esc(tp.title)+"</h1><p class=\"set-sub\">"+esc(tp.sub)+"</p></div></div>";
  var modes=[["all","All",base.total],["left","Not attempted",base.total-base.att],["wrong","Mistakes",base.bad]];
  h+="<div class=\"modes\" role=\"group\" aria-label=\"Which questions to show\">";
  modes.forEach(function(m){h+="<button class=\"mode\" data-act=\"mode\" data-mode=\""+m[0]+"\" aria-pressed=\""+(view.mode===m[0])+"\">"+m[1]+" ("+m[2]+")</button>"});
  h+="</div>";

  if(!view.ids.length){
    h+="<div class=\"empty\">";
    if(view.mode==="wrong"){
      h+="<h2>No mistakes to revise here</h2><p>Questions you answer wrongly collect here, so you can come back and revise them.</p><button class=\"btn primary\" data-act=\"mode\" data-mode=\"all\">Practise all questions</button>";
    }else{
      h+="<h2>You’ve attempted every question here</h2><p>Revise the ones you missed, or reset this topic from the marksheet to start fresh.</p><button class=\"btn primary\" data-act=\"mode\" data-mode=\"wrong\">Revise mistakes</button> <button class=\"btn\" data-act=\"board\">See marksheet</button>";
    }
    h+="</div></div>";
    mainEl.innerHTML=h;return;
  }

  view.i=Math.max(0,Math.min(view.i,view.ids.length-1));
  var q=byId[view.ids[view.i]];
  var a=store.answers[q.id];

  var dots="";
  view.ids.forEach(function(id,k){
    var aa=store.answers[id];
    var cls="dot"+(aa?(aa.ok?" ok":" bad"):"")+(k===view.i?" cur":"");
    var lbl="Question "+(k+1)+(aa?(aa.ok?", correct":", wrong"):", not attempted");
    dots+="<button class=\""+cls+"\" data-act=\"go\" data-i=\""+k+"\" aria-label=\""+lbl+"\""+(k===view.i?" aria-current=\"true\"":"")+">"+(k+1)+"</button>";
  });
  if(view.ids.length>40)h+="<details class=\"jump\"><summary>Jump to a question</summary><div class=\"strip\">"+dots+"</div></details>";
  else h+="<div class=\"strip\" aria-label=\"Questions in this set\">"+dots+"</div>";

  var showTag=view.s==null;
  var tagText=view.t==null?TOPICS[q.t].name:TOPICS[q.t].subs[q.s];
  h+="<article class=\"sheet\" aria-labelledby=\"qtext\">";
  h+="<div class=\"qhead\"><span class=\"qnum\">"+(view.i+1)+"</span><span class=\"qof\">of "+view.ids.length+"</span>"+(showTag?"<span class=\"qtag\">"+esc(tagText)+"</span>":"")+"</div>";
  h+="<p class=\"qtext\" id=\"qtext\">"+esc(q.q)+"</p>";
  h+="<ul class=\"opts\">";
  var correctPos=q.order.indexOf(0);
  q.order.forEach(function(orig,k){
    var cls="opt",label="";
    if(a){
      if(orig===0){cls+=" is-correct";label="<span class=\"olabel\">Correct answer</span>"}
      else if(orig===a.c){cls+=" is-wrong";label="<span class=\"olabel\">Your answer</span>"}
      else cls+=" is-dim";
    }
    h+="<li><button class=\""+cls+"\" data-act=\"pick\" data-k=\""+k+"\""+(a?" aria-disabled=\"true\"":"")+">"+
       "<span class=\"bubble\" aria-hidden=\"true\">"+LETTERS[k]+"</span>"+
       "<span class=\"otext\"><span class=\"sr\">Option "+LETTERS[k]+": </span>"+esc(q.opts[orig])+label+"</span></button></li>";
  });
  h+="</ul>";
  h+="<div aria-live=\"polite\">";
  if(a){
    h+="<div class=\"explain "+(a.ok?"ok":"bad")+"\">";
    h+="<p class=\"verdict\">"+(a.ok?"Sahi jawab! Well done.":"Galat. Sahi answer hai "+LETTERS[correctPos]+".")+"</p>";
    h+="<p class=\"ex\"><span class=\"ex-label\">Why: </span>"+esc(q.ex)+"</p>";
    h+="</div>";
  }
  h+="</div></article>";

  var last=view.i>=view.ids.length-1;
  h+="<div class=\"controls\">";
  h+="<button class=\"btn\" data-act=\"prev\""+(view.i===0?" disabled":"")+">Previous</button>";
  if(a)h+="<button class=\"btn quiet\" data-act=\"retry\">Try this one again</button>";
  h+="<span class=\"spacer\"></span>";
  if(last)h+="<button class=\"btn primary\" data-act=\"board\" id=\"nextBtn\">Finish and see marksheet</button>";
  else h+="<button class=\"btn primary\" data-act=\"next\" id=\"nextBtn\">Next question</button>";
  h+="</div>";
  h+="<p class=\"hint\">Shortcuts: press <kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>←</kbd> <kbd>→</kbd> to move between questions.</p>";
  h+="</div>";
  mainEl.innerHTML=h;
}

function bar(st){
  if(!st.total)return"<div class=\"bar\"></div>";
  return"<div class=\"bar\" role=\"img\" aria-label=\""+st.ok+" correct, "+st.bad+" wrong, "+(st.total-st.att)+" not attempted\"><i class=\"b-ok\" style=\"width:"+(st.ok/st.total*100)+"%\"></i><i class=\"b-bad\" style=\"width:"+(st.bad/st.total*100)+"%\"></i></div>";
}

function renderBoard(){
  var all=stat(function(){return true});
  var h="<section class=\"board\">";
  h+="<h1>Marksheet</h1>";
  h+="<p class=\"lede\">"+TOTAL+" commonly asked GenAI interview questions for freshers, in "+TOPICS.length+" sections. Every answer is saved in this browser, so your marks are still here when you come back. Pick any section or subtopic to practise.</p>";

  h+="<div class=\"total\"><div class=\"total-marks\">"+all.ok+"<small> / "+TOTAL+"</small><span class=\"total-cap\">marks obtained</span></div><div class=\"total-facts\">";
  h+="<p><b>"+pct(all)+"</b> accuracy on <b>"+all.att+"</b> attempted</p>";
  h+="<p><b>"+(TOTAL-all.att)+"</b> questions still to attempt</p>";
  h+="<div class=\"total-actions\">";
  if(store.pos&&store.pos.id&&byId[store.pos.id])h+="<button class=\"btn primary\" data-act=\"continue\">Continue where you left off</button>";
  else h+="<button class=\"btn primary\" data-act=\"topic\" data-t=\"0\">Start with Section A</button>";
  if(all.bad>0)h+="<button class=\"btn\" data-act=\"practise\" data-t=\"\" data-mode=\"wrong\">Revise all "+all.bad+" mistakes</button>";
  h+="</div></div></div>";

  var weak=[];
  TOPICS.forEach(function(tp,ti){tp.subs.forEach(function(sn,si){
    var st=stat(function(q){return q.t===ti&&q.s===si});
    if(st.bad>0)weak.push({t:ti,s:si,st:st,acc:st.ok/st.att});
  })});
  weak.sort(function(x,y){return x.acc-y.acc||y.st.bad-x.st.bad});
  if(weak.length){
    h+="<div class=\"weak\"><h2>Revise these first</h2><ul>";
    weak.slice(0,3).forEach(function(w){
      h+="<li><button data-act=\"practise\" data-t=\""+w.t+"\" data-s=\""+w.s+"\" data-mode=\"wrong\">"+esc(TOPICS[w.t].subs[w.s])+"</button> <span>in Section "+SEC[w.t]+", "+w.st.ok+" of "+w.st.att+" correct</span></li>";
    });
    h+="</ul></div>";
  }

  h+="<div class=\"marks-wrap\"><table><thead><tr><th>Section</th><th>Topic</th><th class=\"num\">Attempted</th><th class=\"num\">Correct</th><th class=\"num\">Accuracy</th><th>Progress</th><th><span class=\"sr\">Actions</span></th></tr></thead><tbody>";
  TOPICS.forEach(function(tp,ti){
    var st=stat(function(q){return q.t===ti});
    h+="<tr class=\"topic\"><td><span class=\"sec-letter"+(st.att===st.total?" full":"")+"\">"+SEC[ti]+"</span></td>"+
       "<td><button class=\"tname\" data-act=\"topic\" data-t=\""+ti+"\">"+esc(tp.name)+"</button></td>"+
       "<td class=\"num\">"+st.att+"/"+st.total+"</td><td class=\"num\">"+st.ok+"</td><td class=\"num\">"+pct(st)+"</td><td>"+bar(st)+"</td>"+
       "<td>"+(st.att?"<button class=\"mini danger\" data-act=\"reset-topic\" data-t=\""+ti+"\">Reset</button>":"")+"</td></tr>";
    tp.subs.forEach(function(sn,si){
      var ss=stat(function(q){return q.t===ti&&q.s===si});
      h+="<tr class=\"subrow\"><td></td><td><button class=\"tname\" data-act=\"sub\" data-t=\""+ti+"\" data-s=\""+si+"\">"+esc(sn)+"</button></td>"+
         "<td class=\"num\">"+ss.att+"/"+ss.total+"</td><td class=\"num\">"+ss.ok+"</td><td class=\"num\">"+pct(ss)+"</td><td>"+bar(ss)+"</td>"+
         "<td>"+(ss.bad?"<button class=\"mini\" data-act=\"practise\" data-t=\""+ti+"\" data-s=\""+si+"\" data-mode=\"wrong\">Revise "+ss.bad+"</button>":"")+"</td></tr>";
    });
  });
  h+="</tbody></table></div>";
  h+="<p class=\"legend\"><span><i style=\"background:var(--ok)\"></i>Correct</span><span><i style=\"background:var(--bad)\"></i>Wrong</span><span><i style=\"background:var(--print-tint);box-shadow:inset 0 0 0 1px var(--print-soft)\"></i>Not attempted</span></p>";
  h+="<div class=\"foot\">"+(all.att?"<button class=\"btn danger\" data-act=\"reset-all\">Reset all scores</button><span>Clears every saved answer in this browser.</span>":"<span>Your answers will be saved here automatically.</span>")+"</div>";
  h+="</section>";
  mainEl.innerHTML=h;
}

/* actions */
function pick(k){
  if(view.name!=="quiz"||!view.ids.length)return;
  var q=byId[view.ids[view.i]];
  if(store.answers[q.id])return;
  var orig=q.order[k];
  store.answers[q.id]={c:orig,ok:orig===0};
  remember();save();render();
  var nb=document.getElementById("nextBtn");if(nb)try{nb.focus({preventScroll:true})}catch(e){}
}
function move(d){
  if(view.name!=="quiz")return;
  var n=view.i+d;
  if(n<0||n>=view.ids.length)return;
  view.i=n;remember();render();toTop(false);
}
function arm(b,label,fn){
  if(b.hasAttribute("data-armed")){fn();return}
  var orig=b.textContent;
  b.setAttribute("data-armed","1");b.textContent=label;
  setTimeout(function(){if(b.isConnected){b.removeAttribute("data-armed");b.textContent=orig}},3500);
}
function numOrNull(v){return v===""||v==null?null:Number(v)}

function openDrawer(){document.body.classList.add("drawer");var m=document.querySelector(".menu-btn");if(m)m.setAttribute("aria-expanded","true")}
function closeDrawer(){document.body.classList.remove("drawer");var m=document.querySelector(".menu-btn");if(m)m.setAttribute("aria-expanded","false")}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  var t=numOrNull(b.getAttribute("data-t")),s=numOrNull(b.getAttribute("data-s"));
  switch(act){
    case"board":openBoard();break;
    case"topic":openQuiz(t,null,"all");break;
    case"sub":openQuiz(t,s,"all");break;
    case"practise":openQuiz(t,s,b.getAttribute("data-mode")||"all");break;
    case"mode":view.mode=b.getAttribute("data-mode");buildIds();view.i=0;
      if(view.mode==="all"){for(var i=0;i<view.ids.length;i++){if(!store.answers[view.ids[i]]){view.i=i;break}}}
      remember();render();break;
    case"pick":pick(Number(b.getAttribute("data-k")));break;
    case"go":view.i=Number(b.getAttribute("data-i"));remember();render();toTop(false);break;
    case"prev":move(-1);break;
    case"next":move(1);break;
    case"retry":if(view.name==="quiz"){delete store.answers[view.ids[view.i]];save();render()}break;
    case"continue":var p=store.pos;openQuiz(p.t,p.s,p.mode,p.id);break;
    case"menu":document.body.classList.contains("drawer")?closeDrawer():openDrawer();break;
    case"menu-close":closeDrawer();break;
    case"reset-topic":arm(b,"Tap again to reset",function(){
      Q.forEach(function(q){if(q.t===t)delete store.answers[q.id]});save();render();});break;
    case"reset-all":arm(b,"Tap again to clear everything",function(){
      store.answers={};store.pos=null;save();render();});break;
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeDrawer();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(view.name!=="quiz")return;
  var k=e.key.toLowerCase();
  var map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){e.preventDefault();pick(map[k]);return}
  if(e.key==="ArrowRight"){e.preventDefault();move(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
});

load();
render();
})();
</script>
</body>
</html>
